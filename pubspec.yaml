name: france
description: "Redécouvrez la France, un secret à la fois."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  url_launcher: ^6.3.0
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  home_widget: ^0.9.3
  share_plus: ^13.2.0
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.3.0
  in_app_review: ^2.0.1
  firebase_messaging: ^16.4.1
  firebase_core: ^4.11.0
  google_mobile_ads: ^5.2.0
  fluttermoji: ^1.0.2
  image_picker: ^1.1.2
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/939303-nature-landscape-clouds-sky-boat-sunset-trees.jpg"
  web:
    generate: true
    image_path: "assets/images/939303-nature-landscape-clouds-sky-boat-sunset-trees.jpg"
    background_color: "#161616"
    theme_color: "#D4AF37"
  windows:
    generate: true
    image_path: "assets/images/939303-nature-landscape-clouds-sky-boat-sunset-trees.jpg"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/imag/
    - assets/image/
    - assets/ima/
    - assets/chateaux/versailles/
    - assets/chateaux/cham/